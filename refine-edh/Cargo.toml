[package]
name = "refine-edh"
description = "EVE data handlers for refine-core crate"
license = "AGPL-3.0-or-later"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"

[dependencies]
# Local
rc = { package = "refine-core", path = "../refine-core" }
# Non-local
reqwest = { version = ">=0.13.4", features = ["blocking"], optional = true }
serde = { version = ">=1.0.229", features = ["derive"], optional = true }
serde_json = { version = ">=1.0.151", features = ["float_roundtrip"], optional = true }
serde_with = { version = ">=3.22.0", optional = true }
thiserror = ">=2.0.20"
url = { version = ">=2.5.8", optional = true }

[features]
phb-fs = ["dep:serde", "dep:serde_json", "dep:serde_with", "serde_json/raw_value"]
phb-http = ["dep:serde", "dep:serde_json", "dep:serde_with", "dep:reqwest", "dep:url", "serde_json/raw_value"]
sde-fs = ["dep:serde", "dep:serde_json"]
sde-http = ["dep:serde", "dep:serde_json", "dep:reqwest", "dep:url"]
