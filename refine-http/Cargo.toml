[package]
name = "refine-http"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"

[dependencies]
rc = { package = "refine-core", path = "../refine-core" }
redh = { package = "refine-edh", path = "../refine-edh", features = ["phb-http"] }
radc = { package = "refine-adc", path = "../refine-adc", features = ["json-zfile"] }
rs = { package = "refine-rs", path = "../refine-rs" }
axum = { version = ">=0.8.9", features = ["query"] }
axum-extra = { version = "0.12.6", features = ["with-rejection"] }
chrono = ">=0.4.45"
config = { version = ">=0.15.25", features = ["toml"] }
educe = { version = ">=0.7.4", features = ["Default"], default-features = false }
itertools = ">=0.15.0"
parking_lot = { version = ">=0.12.5", features = ["nightly"] }
serde = { version = ">=1.0.228", features = ["derive"] }
serde_json = ">=1.0.150"
serde_tuple = ">=1.1.3"
serde_with = ">=3.21.0"
thiserror = ">=2.0.18"
tokio = { version = ">=1.52.3", features = ["full"] }
tokio-rayon = ">=2.1.0"
tower = ">=0.5.3"
tower-http = { version = ">=0.7.0", features = ["normalize-path", "trace"] }
tower-request-id = ">=0.3.0"
time = { version = ">=0.3.53", features = ["macros"] }
tracing = ">=0.1.44"
tracing-appender = ">=0.2.5"
tracing-subscriber = { version = ">=0.3.23", features = ["time"] }
uuid = { version = ">=1.23.4", features = ["v4", "fast-rng"] }
