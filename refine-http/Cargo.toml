[package]
name = "refine-http"
description = "HTTP interface built on top of refine-rs"
license = "AGPL-3.0-or-later"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"

[dependencies]
# Local
rs = { workspace = true, features = ["edh-phb-http", "adc-fs", "serde"] }
# Non-local
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
axum-extra = { workspace = true, features = ["with-rejection"] }
config = { workspace = true, features = ["toml"] }
http-body-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "macros"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["normalize-path", "trace"] }
tower-request-id = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["time"] }
