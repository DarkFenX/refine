[workspace]
members = [
    "refine-core",
    "refine-adc",
    "refine-edh",
    "refine-rs",
    "refine-http",
    "util/refine-serde",
    "util/refine-serde-derive",
    "examples/pg-core",
    "examples/pg-rs",
]
resolver = "2"

[workspace.dependencies]
rc = { package = "refine-core", path = "refine-core" }
redh = { package = "refine-edh", path = "refine-edh" }
radc = { package = "refine-adc", path = "refine-adc" }
rs = { package = "refine-rs", path = "refine-rs" }
refine-serde = { path = "util/refine-serde" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[profile.release-opt]
inherits = "release"
codegen-units = 1
lto = "fat"
panic = "abort"
