[workspace]
members = [
    "refine-core",
    "refine-adc",
    "refine-edh",
    "refine-rs",
    "refine-http",
    "util/refine-serde",
    "util/refine-serde-derive",
    "examples/pg-core",
    "examples/pg-rs",
]
resolver = "2"

[workspace.dependencies]
# Local
rc = { package = "refine-core", path = "refine-core" }
redh = { package = "refine-edh", path = "refine-edh" }
radc = { package = "refine-adc", path = "refine-adc" }
rs = { package = "refine-rs", path = "refine-rs" }
refine-serde = { path = "util/refine-serde" }
# Non-local
angle-sc = ">=2.0.1"
axum = { version = ">=0.8.9", default-features = false }
axum-extra = ">=0.12.6"
config = ">=0.15.25"
cranelift-entity = ">=0.134.3"
derive_more = ">=2.1.1"
fixedstr = ">=0.5.11"
http-body-util = ">=0.1.4"
indexmap = ">=2.14.0"
itertools = ">=0.15.0"
lender = ">=0.8.0"
num-integer = ">=0.1.46"
ordered-float = ">=5.3.0"
parking_lot = ">=0.12.5"
postcard = ">=1.1.3"
proc-macro2 = ">=1.0.107"
quote = ">=1.0.47"
reqwest = ">=0.13.4"
rustc-hash = ">=2.1.3"
serde = ">=1.0.229"
serde_json = { version = ">=1.0.151", features = ["float_roundtrip"] }  # Better float accuracy
serde_repr = ">=0.1.21"
serde_tuple = ">=1.1.3"
serde_with = ">=3.22.0"
slab = ">=0.4.12"
smallvec = ">=1.15.2"
syn = ">=3.0.3"
thiserror = ">=2.0.20"
time = ">=0.3.55"
tokio = ">=1.53.1"
tokio-rayon = ">=2.1.0"
tower = ">=0.5.3"
tower-http = ">=0.7.0"
tower-request-id = ">=0.3.0"
tracing = ">=0.1.44"
tracing-appender = ">=0.2.5"
tracing-subscriber = ">=0.3.23"
url = ">=2.5.8"
uuid = ">=1.24.0"
zstd = ">=0.13.3"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[profile.release-opt]
inherits = "release"
codegen-units = 1
lto = "fat"
panic = "abort"
