[package]
name = "refine-adc"
description = "Adapted data cachers for refine-core crate"
license = "AGPL-3.0-or-later"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"

[dependencies]
rc = { package = "refine-core", path = "../refine-core" }
serde = { version = ">=1.0.229", features = ["derive"], optional = true }
serde_json = { version = ">=1.0.151", features = ["float_roundtrip"], optional = true }
postcard = { version = ">=1.1.3", features = ["use-std"], optional = true }
thiserror = { version = ">=2.0.19", optional = true }
zstd = { version = ">=0.13.3", optional = true }

[features]
json-zfile = [
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:zstd",
    "rc/serde-ad",
]
postcard-zfile = [
    "dep:postcard",
    "dep:serde",
    "dep:thiserror",
    "dep:zstd",
    "rc/serde-ad",
]
