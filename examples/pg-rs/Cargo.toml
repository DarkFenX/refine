[package]
name = "refine-example-playground-rs"
license = "Unlicense"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"
publish = false

[dependencies]
rs = { workspace = true, features = ["edh-phb-fs", "adc-fs"] }
time = { version = ">=0.3.55", features = ["macros"] }
tokio = { version = ">=1.53.1", features = ["rt", "macros"] }
tracing = ">=0.1.44"
tracing-subscriber = { version = ">=0.3.23", features = ["time"] }
