[package]
name = "refine-example-playground-core"
license = "Unlicense"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"
publish = false

[dependencies]
# Local
rc = { package = "refine-core", path = "../../refine-core" }
redh = { package = "refine-edh", path = "../../refine-edh", features = ["phb-fs"] }
radc = { package = "refine-adc", path = "../../refine-adc", features = ["json-zfs"] }
# Non-local
chrono = ">=0.4.45"
itertools = ">=0.15.0"
time = { version = ">=0.3.55", features = ["macros"] }
tracing = ">=0.1.44"
tracing-subscriber = { version = ">=0.3.23", features = ["time"] }
