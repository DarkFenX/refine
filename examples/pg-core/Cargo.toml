[package]
name = "refine-example-playground-core"
license = "Unlicense"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"
publish = false

[dependencies]
rc = { workspace = true }
redh = { workspace = true, features = ["phb-fs"] }
radc = { workspace = true, features = ["json-zfile"] }
chrono = ">=0.4.45"
itertools = ">=0.15.0"
time = { version = ">=0.3.55", features = ["macros"] }
tracing = ">=0.1.44"
tracing-subscriber = { version = ">=0.3.23", features = ["time"] }
