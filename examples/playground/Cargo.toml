[package]
name = "refine-example-playground"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"

[dependencies]
rc = { package = "refine-core", path = "../../refine-core" }
redh = { package = "refine-edh", path = "../../refine-edh", features = ["phb-file"] }
radc = { package = "refine-adc", path = "../../refine-adc", features = ["json-zfile"] }
chrono = ">=0.4.45"
itertools = ">=0.15.0"
time = { version = ">=0.3.49", features = ["macros"] }
tracing = ">=0.1.44"
tracing-subscriber = { version = ">=0.3.23", features = ["time"] }
