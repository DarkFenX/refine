[package]
name = "refine-rs"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"

[dependencies]
rc = { package = "refine-core", path = "../refine-core" }
redh = { package = "refine-edh", path = "../refine-edh", features = ["phb-http"] }
radc = { package = "refine-adc", path = "../refine-adc", features = ["json-zfile"] }
serde = { version = ">=1.0.228", features = ["derive"] }
serde_json = ">=1.0.150"
serde_tuple = ">=1.1.3"
serde_with = ">=3.21.0"
thiserror = ">=2.0.18"
tokio = { version = ">=1.52.3", features = ["full"] }
tokio-rayon = ">=2.1.0"
tracing = ">=0.1.44"
