[package]
name = "refine-rs"
description = "Higher-level Rust interface built on top of refine-core"
license = "AGPL-3.0-or-later"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"

[dependencies]
# Local
rc = { package = "refine-core", path = "../refine-core" }
# Non-local
derive_more = { version = ">=2.1.1", features = ["display"] }
fixedstr = { version = ">=0.5.11", features = ["fstr"] }
parking_lot = { version = ">=0.12.5", features = ["nightly"] }
serde = { version = ">=1.0.229", features = ["derive"], optional = true }
serde_tuple = { version = ">=1.1.3", optional = true }
serde_with = { version = ">=3.22.0", optional = true }
thiserror = ">=2.0.20"
time = ">=0.3.55"
tokio = { version = ">=1.53.1", features = ["sync", "time"] }
tokio-rayon = ">=2.1.0"
tracing = ">=0.1.44"
uuid = { version = ">=1.24.1", features = ["fast-rng", "v4"] }

[features]
serde = [
    "dep:serde",
    "dep:serde_tuple",
    "dep:serde_with",
    "rc/serde",
    "fixedstr/serde",
    "time/formatting",
    "time/macros",
    "uuid/serde",
]
