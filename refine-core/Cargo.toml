[package]
name = "refine-core"
description = "Rust Eve FIttiNg Engine."
license = "AGPL-3.0-or-later"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"

[dependencies]
# Local
refine-serde = { workspace = true, optional = true }
# Non-local
angle-sc = { workspace = true }
cranelift-entity = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
indexmap = { workspace = true }
itertools = { workspace = true }
lender = { workspace = true }
num-integer = { workspace = true }
ordered-float = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_repr = { workspace = true, optional = true }
serde_tuple = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
slab = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }

[features]
serde = ["dep:refine-serde", "dep:serde", "dep:serde_tuple", "dep:serde_with", "derive_more/from_str"]
serde-ad = ["dep:serde", "dep:serde_repr", "dep:serde_tuple", "derive_more/from_str"]
