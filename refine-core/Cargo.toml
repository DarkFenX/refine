[package]
name = "refine-core"
description = "Rust Eve FIttiNg Engine."
license = "AGPL-3.0-or-later"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"

[dependencies]
angle-sc = ">=1.1.5"
cranelift-entity = ">=0.133.1"
derive_more = { version = ">=2.1.1", features = ["display"] }
either = ">=0.16.0"
indexmap = ">=2.14.0"
itertools = ">=0.15.0"
lender = ">=0.8.0"
num-integer = ">=0.1.46"
ordered-float = ">=5.3.0"
rustc-hash = ">=2.1.3"
serde = { version = ">=1.0.228", features = ["derive"], optional = true }
slab = ">=0.4.12"
smallvec = ">=1.15.2"
thiserror = ">=2.0.18"

[features]
serde = [
    "dep:serde",
]
