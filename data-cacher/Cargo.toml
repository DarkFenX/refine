[package]
name = "refine-adc"
version = "0.1.0"
authors = ["DarkPhoenix <phoenix@mail.ru>"]
edition = "2024"
description = "Adapted data cachers for refine-core crate"
license = "LGPL-3.0-or-later"

[features]
full = ["json-zfile"]
json-zfile = [
    "dep:serde",
    "dep:serde_json",
    "dep:serde_repr",
    "dep:serde_tuple",
    "dep:serde_with",
    "dep:struson",
    "dep:thiserror",
    "dep:zstd",
]

[dependencies]
rc = { package = "refine-core", path = "../core" }
serde = { version = ">=1.0.228", features = ["derive"], optional = true }
serde_json = { version = ">=1.0.150", optional = true }
serde_repr = { version = ">=0.1.20", optional = true }
serde_tuple = { version = ">=1.1.3", optional = true }
serde_with = { version = ">=3.21.0", optional = true }
struson = { version = ">=0.7.2", features = ["serde"], optional = true }
thiserror = { version = ">=2.0.18", optional = true }
zstd = { version = ">=0.13.3", optional = true }
